<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'"><title>Console accent preview · sample data</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' fill='%23ff9900'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:#f5f5f5;color:#171717}body.awsui-dark-mode{background:#101010;color:#eee}.demo{padding:6px 16px;background:#ff9900;color:#171717;text-align:center;font-size:12px}header{position:relative;display:flex;align-items:center;gap:26px;padding:0 22px;background:#161d26;color:#eee;height:60px}header strong{font-size:24px}.native-top-strip{position:absolute;left:0;right:0;top:0;height:4px;background:#7d8998}header .search{flex:1;border:1px solid #637080;border-radius:5px;max-width:560px;padding:4px 12px;color:#b8bfc9;font-style:italic}.region{margin-left:auto;font-size:12px}#nav-usernameMenu{height:calc(100% - 4px);align-self:end;font:12px/1.5 system-ui;text-align:left;color:#ddd;background:transparent;border:0;padding:5px 10px;cursor:pointer;min-width:260px}#nav-usernameMenu .native-account-color{position:relative;background:#7d8998;color:#16191f;padding:0 6px;border-radius:3px;font-weight:700}#nav-usernameMenu .native-account-color::before,#nav-usernameMenu .native-account-color::after{content:"";position:absolute;top:0;width:8px;height:8px;border-radius:50%}#nav-usernameMenu .native-account-color::before{left:-8px;box-shadow:4px 0 0 #7d8998}#nav-usernameMenu .native-account-color::after{right:-8px;box-shadow:-4px 0 0 #7d8998}#nav-usernameMenu .native-account-color span{color:#16191f}#nav-usernameMenu .role{padding:1px 6px}.controls{display:flex;align-items:end;gap:16px;padding:20px 24px;flex-wrap:wrap;border-bottom:1px solid #7775}.controls label{display:flex;flex-direction:column;gap:5px;font-size:12px}.controls input,.controls select,.controls button{font:inherit;padding:6px 10px;border:1px solid #999;border-radius:5px;background:#fff;color:#171717}.controls input[type=color]{height:35px;width:90px;padding:3px}.controls button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ff9900;outline-offset:2px}main{padding:28px 24px}h1{margin:0 0 8px;font-size:25px}p{color:#888}#preview-state{font-size:12px;margin:8px 24px}
.tab-preview{margin:20px 0;padding:16px;background:#202020;border:1px solid #555;border-radius:8px;max-width:460px}.tab-preview small{display:block;color:#bbb;margin-bottom:10px}.preview-tab{display:flex;align-items:center;gap:12px;padding:12px;background:#303030;border-radius:8px;color:#eee}.preview-tab span:last-child{margin-left:auto;color:#bbb}
</style></head>
<body class="awsui-visual-refresh"><div class="demo">Demo preview · sample accounts only · no AWS connection or preference changes</div>
<header id="awsc-nav-header"><div class="native-top-strip" role="img" aria-label="Account color: Unset"></div><strong>aws</strong><span class="search">Search</span><span class="region">United States (Ohio)</span><button id="nav-usernameMenu" type="button"><div class="native-account-color"><span id="account-label"></span> ▾</div><div class="role" id="role-label"></div></button></header>
<div class="controls"><label>Sample profile<select id="preview-profile"><option value="developer">Development / Developer</option><option value="readonly">Development / ReadOnly</option></select></label><label>Profile color<input id="preview-color" type="color" value="#ff9900"></label><button id="preview-clear">Clear profile</button><button id="preview-apply">Apply profile</button><button id="preview-rebuild">Rebuild account button</button></div>
<div id="preview-state" role="status"></div><main><h1>Console appearance preview</h1><p>This local fixture uses the extension’s actual appearance adapter and the observed AWS header structure.</p><section class="tab-preview" aria-label="Tab icon preview"><small>Sample tab layout · actual favicon image</small><div class="preview-tab"><img id="preview-tab-icon" width="24" height="24" alt="Current tab favicon"><span id="preview-tab-label">Console Home</span><span aria-hidden="true">×</span></div></section></main>
<script src="console-preview.js"></script></body></html>
